<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse · Intelligence Layer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0c'/%3E%3Cpath d='M8 32h12l5-14 8 28 6-20 4 6h13' fill='none' stroke='%23C9A14A' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='53' cy='32' r='4' fill='%234ade80'/%3E%3C/svg%3E">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c; --bg-2:#111114; --panel:#16161a; --panel-2:#1c1c22;
  --border:#26262e; --border-2:#33333d;
  --text:#f2f2f5; --text-dim:#9a9aa8; --text-faint:#65656f;
  --gold:#C9A14A; --gold-light:#E5C77E;
  --pulse:#4ade80; --pulse-glow:rgba(74,222,128,0.4);
  --maroon:#8B1538;
  --green:#4ade80; --amber:#fbbf24; --orange:#fb7185;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;}
.serif{font-family:'Fraunces',serif;}

/* ===== LOGIN GATE ===== */
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;}
.gate-box{width:100%;max-width:360px;text-align:center;}
.gate-logo{font-family:'Fraunces',serif;font-size:38px;font-weight:700;letter-spacing:-1px;margin-bottom:6px;}
.gate-logo .dot{color:var(--gold);}
.gate-sub{color:var(--text-faint);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:36px;}
.gate-box input{width:100%;padding:15px 18px;background:var(--panel);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-family:'Inter';margin-bottom:12px;}
.gate-box input:focus{outline:none;border-color:var(--gold);}
.gate-box button{width:100%;padding:15px;background:var(--gold);color:#1a1a1a;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter';transition:all .2s;}
.gate-box button:hover{background:var(--gold-light);}
.gate-err{color:var(--orange);font-size:13px;margin-top:12px;min-height:18px;}

/* ===== APP ===== */
#app{display:none;max-width:1100px;margin:0 auto;padding:28px 24px 60px;}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:12px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand .logo{font-family:'Fraunces',serif;font-size:30px;font-weight:700;letter-spacing:-0.5px;}
.brand .logo .dot{color:var(--gold);}
.top-right{display:flex;align-items:center;gap:16px;}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;}
.live .beat{width:8px;height:8px;border-radius:50%;background:var(--pulse);box-shadow:0 0 0 0 var(--pulse-glow);animation:beat 2s infinite;}
.synced{font-size:12px;color:var(--text-faint);letter-spacing:1px;text-transform:uppercase;}
@keyframes beat{0%{box-shadow:0 0 0 0 var(--pulse-glow);}70%{box-shadow:0 0 0 10px rgba(74,222,128,0);}100%{box-shadow:0 0 0 0 rgba(74,222,128,0);}}
.client-tag{font-size:13px;color:var(--text-faint);margin-bottom:20px;}
.client-tag strong{color:var(--text-dim);font-weight:600;}

/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:26px;border-bottom:1px solid var(--border);padding-bottom:0;flex-wrap:wrap;}
.tab{padding:10px 18px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-faint);font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter';margin-bottom:-1px;transition:all .18s;}
.tab.active{color:var(--text);border-bottom-color:var(--gold);}
.tab.disabled{color:var(--text-faint);opacity:0.45;cursor:not-allowed;display:flex;align-items:center;gap:7px;}
.tab .soon{font-size:9px;background:var(--panel-2);color:var(--gold);padding:2px 7px;border-radius:50px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;}

/* time filter */
.filters{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.filters button{padding:8px 16px;background:var(--panel);border:1px solid var(--border);border-radius:50px;color:var(--text-dim);font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter';transition:all .18s;}
.filters button.active{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:700;}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px 22px;position:relative;overflow:hidden;}
.stat::after{content:'';position:absolute;top:0;right:0;width:60px;height:60px;background:radial-gradient(circle,rgba(201,161,74,0.08),transparent 70%);}
.stat .label{font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.stat .num{font-family:'Fraunces',serif;font-size:38px;font-weight:700;line-height:1;}
.stat .sub{font-size:12px;color:var(--text-dim);margin-top:6px;}
.stat.accent .num{color:var(--gold);}

/* panels grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px 24px;}
.panel h3{font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:18px;}

/* bar rows */
.bar-row{margin-bottom:14px;}
.bar-row:last-child{margin-bottom:0;}
.bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.bar-head .bl{color:var(--text);}
.bar-head .bv{color:var(--text-dim);font-variant-numeric:tabular-nums;}
.bar-track{height:8px;background:var(--bg-2);border-radius:50px;overflow:hidden;}
.bar-fill{height:100%;border-radius:50px;transition:width .8s ease;}

/* trend chart */
.trend{display:flex;align-items:flex-end;gap:4px;height:140px;margin-top:20px;padding-top:18px;}
.trend .val{font-size:11px;font-weight:700;color:var(--text);margin-bottom:4px;white-space:nowrap;}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;}
.trend .bar{width:100%;max-width:32px;background:linear-gradient(180deg,var(--gold),rgba(201,161,74,0.3));border-radius:4px 4px 0 0;min-height:3px;transition:height .8s ease;flex-shrink:0;}
.trend .day{font-size:10px;color:var(--text-faint);}

/* recent table */
.recent{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px 24px;}
.recent h3{font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:16px;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;color:var(--text-faint);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--border);}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--bg-2);color:var(--text-dim);}
.tbl tr:last-child td{border-bottom:none;}
.tbl .nm{color:var(--text);font-weight:500;}
.tbl .sc{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text);}
.zpill{display:inline-block;padding:3px 10px;border-radius:50px;font-size:11px;font-weight:600;}
.z-thriving{background:rgba(74,222,128,0.12);color:var(--green);}
.z-growth{background:rgba(251,191,36,0.12);color:var(--amber);}
.z-attention{background:rgba(167,139,250,0.14);color:#a78bfa;}
.z-needs{background:rgba(251,113,133,0.12);color:var(--orange);}

.loading{text-align:center;color:var(--text-faint);padding:60px;font-size:14px;}
.tease{background:linear-gradient(135deg,rgba(201,161,74,0.08),rgba(201,161,74,0.02));border:1px solid var(--border-2);border-radius:14px;padding:16px 20px;margin-bottom:22px;font-size:14px;color:var(--text-dim);}
.tease strong{color:var(--gold);font-weight:600;}
.foot{text-align:center;color:var(--text-faint);font-size:12px;margin-top:40px;}
.foot .p{color:var(--gold);}

/* follow-up desk */
.desk-controls{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.desk-controls button{padding:8px 14px;background:var(--panel);border:1px solid var(--border);border-radius:50px;color:var(--text-dim);font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter';transition:all .18s;}
.desk-controls button.active{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:700;}
.desk-controls select{padding:8px 12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-family:'Inter';}
.desk-search{padding:8px 14px;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-family:'Inter';min-width:180px;}
.desk-search:focus{outline:none;border-color:var(--gold);}
.lead{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:10px;}
.lead.saving{border-color:var(--gold);}
.lead-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;}
.lead-name{font-weight:700;color:var(--text);font-size:15px;}
.lead-links{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;}
.lead-links a{color:var(--gold);text-decoration:none;font-weight:600;}
.lead-links a:hover{text-decoration:underline;}
.lead-sub{font-size:12px;color:var(--text-faint);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.lead-edit{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;}
.lead-edit select,.lead-edit input{padding:8px 10px;background:var(--bg-2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:13px;font-family:'Inter';}
.lead-edit input[type=text]{flex:1;min-width:160px;}
.lead-edit select:focus,.lead-edit input:focus{outline:none;border-color:var(--gold);}
.lead-saved{font-size:12px;color:var(--green);min-width:52px;}
.due{color:var(--orange)!important;font-weight:700;}
.src-pill{display:inline-block;padding:3px 10px;border-radius:50px;font-size:11px;font-weight:600;background:var(--bg-2);color:var(--text-dim);}

@media (max-width:780px){
  .stats{grid-template-columns:repeat(2,1fr);}
  .grid{grid-template-columns:1fr;}
  .tbl .hide-m{display:none;}
}
</style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-logo">Pulse<span class="dot">.</span></div>
    <div class="gate-sub">Intelligence Layer</div>
    <input type="password" id="pass" placeholder="Access key" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Enter →</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="top">
    <div class="brand">
      <div class="logo">Pulse<span class="dot">.</span></div>
    </div>
    <div class="top-right">
      <div class="live"><span class="beat"></span> Live</div>
      <div class="synced" id="lastSync"></div>
    </div>
  </div>
  <div class="client-tag">Client · <strong>Dr. Madhu Sudan</strong></div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" data-tab="overview" onclick="setTab('overview',this)">Overview</button>
    <button class="tab" data-tab="assessment" onclick="setTab('assessment',this)">Assessment</button>
    <button class="tab" data-tab="revenue" onclick="setTab('revenue',this)">Revenue</button>
    <button class="tab" data-tab="content" onclick="setTab('content',this)">Content</button>
    <button class="tab" data-tab="funnels" onclick="setTab('funnels',this)">Funnels</button>
    <button class="tab" data-tab="desk" onclick="setTab('desk',this)">Follow-ups</button>
  </div>

  <div class="filters">
    <button data-range="today" onclick="setRange('today',this)">Today</button>
    <button data-range="week" class="active" onclick="setRange('week',this)">This Week</button>
    <button data-range="month" onclick="setRange('month',this)">This Month</button>
    <button data-range="total" onclick="setRange('total',this)">All Time</button>
  </div>

  <div id="content"><div class="loading">Reading the pulse…</div></div>

  <div class="foot">Powered by <span class="p">Pulse</span> · Peepoye Network</div>
</div>

<script>
let DATA = null;
let RANGE = 'week';
let TAB = 'overview';

function setTab(t, btn){
  TAB = t;
  document.querySelectorAll('.tab:not(.disabled)').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  // The follow-up desk has its own filters — the time range row does not apply
  document.querySelector('.filters').style.display = (t==='desk') ? 'none' : '';
  applyRangeAvailability();
  render();
}

// Content tab is monthly/manual — Today & This Week don't apply, grey them out
function applyRangeAvailability(){
  const monthlyOnly = (TAB==='content');
  document.querySelectorAll('.filters button').forEach(b=>{
    const r = b.getAttribute('data-range');
    if(monthlyOnly && (r==='today' || r==='week')){
      b.disabled = true;
      b.style.opacity = '0.35';
      b.style.cursor = 'not-allowed';
      if(b.classList.contains('active')){
        b.classList.remove('active');
        RANGE = 'month';
        const mBtn = document.querySelector('.filters button[data-range="month"]');
        if(mBtn) mBtn.classList.add('active');
      }
    } else {
      b.disabled = false;
      b.style.opacity = '';
      b.style.cursor = '';
    }
  });
}

function login(){
  const p = document.getElementById('pass').value;
  fetch('/api/data', { headers: { 'x-pulse-pass': p } })
    .then(r => { if(!r.ok) throw new Error('bad'); return r.json(); })
    .then(d => {
      DATA = d;
      sessionStorage.setItem('pulse_p', p);
      document.getElementById('gate').style.display='none';
      document.getElementById('app').style.display='block';
      render();
    })
    .catch(() => { document.getElementById('gateErr').textContent = 'Wrong access key. Try again.'; });
}

// auto-login if key stored this session
window.addEventListener('load', ()=>{
  const p = sessionStorage.getItem('pulse_p');
  if(p){
    fetch('/api/data',{headers:{'x-pulse-pass':p}}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{
      DATA=d; document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; render();
    }).catch(()=>{});
  }
});

function setRange(r, btn){
  if(btn.disabled) return;
  RANGE = r;
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function zClass(z){ return z==='Thriving'?'z-thriving':z==='Growth'?'z-growth':'z-needs'; }
function zColor(z){ return z==='Thriving'?'var(--green)':z==='Growth'?'var(--amber)':'var(--orange)'; }

function render(){
  if(TAB==='desk')       { renderDesk();       return; }
  if(!DATA) return;
  if(TAB==='revenue')    { renderRevenue();    return; }
  if(TAB==='content')    { renderContent();    return; }
  if(TAB==='funnels')    { renderFunnels();    return; }
  if(TAB==='assessment') { renderAssessment(); return; }
  renderOverview();
}

function renderAssessment(){
  if(!DATA) return;
  const s = DATA.stats;
  const recent = DATA.recent || [];
  const rangeCount = s[RANGE] != null ? s[RANGE] : s.total;
  const rangeLabel = {today:'Today',week:'This Week',month:'This Month',total:'All Time'}[RANGE];

  // zone bars
  const zones = s.zones || {};
  const zOrder = ['Thriving','Growth','Needs Attention'];
  const zMax = Math.max(1, ...Object.values(zones));
  let zoneBars = zOrder.filter(z=>zones[z]).map(z=>{
    const v = zones[z]||0;
    return `<div class="bar-row"><div class="bar-head"><span class="bl">${z}</span><span class="bv">${v}</span></div><div class="bar-track"><div class="bar-fill" style="width:${v/zMax*100}%;background:${zColor(z)}"></div></div></div>`;
  }).join('');

  // concern bars
  const concerns = s.concerns || {};
  const cMax = Math.max(1, ...Object.values(concerns));
  let concernBars = Object.entries(concerns).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
    const label = k||'Not specified';
    return `<div class="bar-row"><div class="bar-head"><span class="bl">${label}</span><span class="bv">${v}</span></div><div class="bar-track"><div class="bar-fill" style="width:${v/cMax*100}%;background:var(--gold)"></div></div></div>`;
  }).join('');

  // daily trend
  const daily = s.daily || [];
  const dMax = Math.max(1, ...daily.map(d=>d.c));
  let trend = daily.slice(-14).map(d=>{
    const h = d.c/dMax*100;
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dd2 = d.day ? (([y,m])=>months[parseInt(m)-1]+"'"+y.slice(2))(d.day.split('-')) : '';
    return `<div class="col"><div class="val">${d.c}</div><div class="bar" style="height:${h}%" title="${d.c} assessments"></div><div class="day">${dd2}</div></div>`;
  }).join('');
  if(!trend) trend = '<div class="loading">No data yet</div>';

  // recent rows
  let rows = recent.slice(0,15).map(r=>`<tr>
    <td class="nm">${r.name||'—'}</td>
    <td class="sc">${r.total_score}</td>
    <td><span class="zpill ${zClass(r.zone)}">${r.zone}</span></td>
    <td class="hide-m">${r.primary_concern||'—'}</td>
    <td class="hide-m">${r.weakest_dimension||'—'}</td>
    <td class="hide-m">${r.created}</td>
  </tr>`).join('');
  if(!rows) rows = '<tr><td colspan="6" style="text-align:center;color:var(--text-faint);padding:30px;">No assessments yet</td></tr>';

  document.getElementById('content').innerHTML = `
    ${TAB==='overview' ? `<div class="tease">📊 Showing <strong>Sexual Wellness Assessment</strong> — your first live funnel. As we launch more funnels and connect revenue, they'll roll up here automatically.</div>` : ''}
    <div class="stats">
      <div class="stat accent"><div class="label">${rangeLabel}</div><div class="num">${rangeCount}</div><div class="sub">assessments taken</div></div>
      <div class="stat"><div class="label">All Time</div><div class="num">${s.total||0}</div><div class="sub">total leads captured</div></div>
      <div class="stat"><div class="label">Avg Score</div><div class="num">${s.avg_score||0}<span style="font-size:16px;color:var(--text-faint)">/120</span></div><div class="sub">across all takers</div></div>
      <div class="stat"><div class="label">Today</div><div class="num">${s.today||0}</div><div class="sub">in the last 24h</div></div>
    </div>

    <div class="grid">
      <div class="panel"><h3>Zone Breakdown</h3>${zoneBars||'<div style="color:var(--text-faint);font-size:13px">No data yet</div>'}</div>
      <div class="panel"><h3>Primary Concern</h3>${concernBars||'<div style="color:var(--text-faint);font-size:13px">No data yet</div>'}</div>
    </div>

    <div class="panel" style="margin-bottom:26px;">
      <h3>Assessments Over Time</h3>
      <div class="trend">${trend}</div>
    </div>

    <div class="recent">
      <h3>Recent Assessments <span style="color:var(--text-faint);font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;">· latest 15</span></h3>
      <table class="tbl">
        <thead><tr><th>Name</th><th>Score</th><th>Zone</th><th class="hide-m">Concern</th><th class="hide-m">Weakest Area</th><th class="hide-m">When</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
  document.getElementById('lastSync').textContent = 'Synced ' + new Date().toLocaleTimeString();
}

function fmtINR(n){
  n = Number(n)||0;
  return '₹' + n.toLocaleString('en-IN');
}

function renderRevenue(){
  if(!DATA) return;
  const r = DATA.revenue || {};
  const recent = DATA.revenue_recent || [];
  const rangeVal = r[RANGE] != null ? r[RANGE] : (r.total||0);
  const rangeLabel = {today:'Today',week:'This Week',month:'This Month',total:'All Time'}[RANGE];

  // ── 5-BUCKET ATTRIBUTION (range-aware: today / week / month / total) ──
  const BUCKETS = [
    { key:'consult',          label:'Consult Organic',   price:'₹497',    col:'var(--green)' },
    { key:'consult-paid-ads', label:'Consult Paid Ads',  price:'₹499',    col:'#a78bfa' },
    { key:'modak-trial',      label:'Modak Trial',       price:'₹1,490',  col:'var(--gold)' },
    { key:'modak-monthly',    label:'Modak Monthly',     price:'₹5,550',  col:'var(--gold)' },
    { key:'modak-quarterly',  label:'Modak 3-Month',     price:'₹15,000', col:'var(--gold)' },
    { key:'other',            label:'Other / Unmapped',  price:'—',       col:'var(--text-faint)' }
  ];
  const bk = (r.buckets && r.buckets[RANGE]) ? r.buckets[RANGE] : {};
  const bMax = Math.max(1, ...BUCKETS.map(b => Number((bk[b.key]||{}).revenue) || 0));
  const rangeCount = r[RANGE + '_count'] != null ? r[RANGE + '_count'] : (r.total_count || 0);

  let bucketRows = BUCKETS.map(b => {
    const d = bk[b.key] || {};
    const cnt = Number(d.count) || 0;
    const rev = Number(d.revenue) || 0;
    const dim = cnt === 0 ? 'opacity:0.4;' : '';
    return `<div class="bar-row" style="${dim}">
      <div class="bar-head">
        <span class="bl">${b.label} <span style="color:var(--text-faint);font-size:11px">· ${b.price}</span></span>
        <span class="bv"><strong style="color:var(--text)">${cnt}</strong> <span style="color:var(--text-faint)">order${cnt===1?'':'s'}</span> &nbsp;·&nbsp; ${fmtINR(rev)}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${rev/bMax*100}%;background:${b.col}"></div></div>
    </div>`;
  }).join('');


  // daily trend
  const daily = r.daily || [];
  const dMax = Math.max(1, ...daily.map(d=>d.r));
  let trend = daily.slice(-14).map(d=>{
    const h = d.r/dMax*100;
    const months2=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dd = d.day ? (([y,m])=>months2[parseInt(m)-1]+"'"+y.slice(2))(d.day.split('-')) : '';
    return `<div class="col"><div class="val">${fmtINR(d.r)}</div><div class="bar" style="height:${h}%" title="${fmtINR(d.r)}"></div><div class="day">${dd}</div></div>`;
  }).join('');
  if(!trend) trend = '<div class="loading">No revenue yet</div>';

  // recent rows
  let rows = recent.slice(0,15).map(p=>{
    const fLabel = p.funnel==='modak' ? ('Modak · '+({trial:'Trial 7 day',monthly:'Monthly 30 day',quarterly:'3-Month 90 day'}[p.pack]||'Pack'))
                 : p.funnel==='consult-paid-ads' ? 'Consult · Paid Ads'
                 : p.funnel==='consult' ? 'Consult · Organic'
                 : 'Other';
    const pillClass = p.funnel==='modak' ? 'z-growth'
                    : p.funnel==='consult-paid-ads' ? 'z-attention'
                    : p.funnel==='consult' ? 'z-thriving'
                    : '';
    const total = (Number(p.amount_rupees)||0) + (Number(p.consult_sale_rupees)||0);
    const medTag = (Number(p.consult_sale_rupees)>0) ? ` <span style="color:var(--text-faint);font-size:11px;">(+${fmtINR(p.consult_sale_rupees)} med)</span>` : '';
    return `<tr>
      <td class="nm">${p.name||'—'}</td>
      <td class="sc">${fmtINR(total)}${medTag}</td>
      <td><span class="zpill ${pillClass}">${fLabel}</span></td>
      <td class="hide-m">${p.created||'—'}</td>
    </tr>`;
  }).join('');
  if(!rows) rows = '<tr><td colspan="4" style="text-align:center;color:var(--text-faint);padding:30px;">No payments yet — this fills in real time as Razorpay captures payments.</td></tr>';

  document.getElementById('content').innerHTML = `
    <div class="tease">💰 <strong>Revenue</strong> — live from Cashfree &amp; Razorpay. Every payment is attributed to one of five funnels by price point. Medicine sales after consults are added manually until the clinic CRM is live.</div>
    <div class="stats">
      <div class="stat accent"><div class="label">${rangeLabel}</div><div class="num" style="font-size:30px;">${fmtINR(rangeVal)}</div><div class="sub">${rangeCount} order${rangeCount===1?'':'s'} ${rangeLabel.toLowerCase()}</div></div>
      <div class="stat"><div class="label">All Time</div><div class="num" style="font-size:30px;">${fmtINR(r.total_rupees||0)}</div><div class="sub">${r.total_count||r.count||0} payments</div></div>
      <div class="stat"><div class="label">Product Orders</div><div class="num" style="font-size:30px;">${fmtINR(r.order_revenue||0)}</div><div class="sub">funnel sales</div></div>
      <div class="stat"><div class="label">Medicine Sales</div><div class="num" style="font-size:30px;">${fmtINR(r.medicine_revenue||0)}</div><div class="sub">post-consult (manual)</div></div>
    </div>

    <div class="panel" style="margin-bottom:26px;">
      <h3>Revenue by Funnel <span style="color:var(--text-faint);font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;">· ${rangeLabel} · orders &amp; revenue</span></h3>
      ${bucketRows}
    </div>

    <div class="panel" style="margin-bottom:26px;">
      <h3>Revenue Over Time</h3>
      <div class="trend">${trend}</div>
    </div>

    <div class="recent">
      <h3>Recent Payments <span style="color:var(--text-faint);font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;">· latest 15</span></h3>
      <table class="tbl">
        <thead><tr><th>Name</th><th>Amount</th><th>Funnel</th><th class="hide-m">When</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
  document.getElementById('lastSync').textContent = 'Synced ' + new Date().toLocaleTimeString();
}

// ─── CONTENT ─────────────────────────────────────────────────────────────────
function renderContent(){
  if(!DATA) return;
  const c=DATA.content||{}, monthly=c.monthly||[], pillars=c.pillars||[];
  const maxV=Math.max(1,...monthly.map(m=>Number(m.views||0)));

  // View curve — month by month (trend-style bars, tall)
  const curve=monthly.map(m=>{
    const v=Number(m.views||0);
    const h=(v/maxV*100).toFixed(1);
    const vShort = v>=100000 ? (v/100000).toFixed(1)+'L' : v>=1000 ? (v/1000).toFixed(0)+'K' : v;
    return `<div class="col"><div class="val">${vShort}</div><div class="bar" style="height:${h}%" title="${v.toLocaleString('en-IN')} views"></div><div class="day">${m.month}</div></div>`;
  }).join('');

  // Reels bars
  const maxR=Math.max(1,...monthly.map(m=>m.reels||0));
  const reelBars=monthly.map(m=>`<div class="bar-row"><div class="bar-head"><span class="bl">${m.month}</span><span class="bv">${m.reels} reels</span></div><div class="bar-track"><div class="bar-fill" style="width:${((m.reels||0)/maxR*100).toFixed(1)}%;background:var(--gold)"></div></div></div>`).join('');

  // Monthly table
  const rows=monthly.map(m=>`<tr><td style="font-weight:600">${m.month}</td><td style="color:var(--gold);font-weight:700">${m.reels||0}</td><td style="color:var(--green);font-weight:700">${Number(m.views||0).toLocaleString('en-IN')}</td><td style="color:var(--text-faint);font-size:12px" class="hide-m">${m.notes||'—'}</td></tr>`).join('');

  // Pillar breakdown (May)
  const maxP=Math.max(1,...pillars.map(p=>Number(p.views||0)));
  const pillarBars=pillars.map(p=>{
    const v=Number(p.views||0);
    return `<div class="bar-row"><div class="bar-head"><span class="bl">${p.pillar} <span style="color:var(--text-faint);font-size:11px">· ${p.published} reels</span></span><span class="bv">${v.toLocaleString('en-IN')}</span></div><div class="bar-track"><div class="bar-fill" style="width:${(v/maxP*100).toFixed(1)}%;background:var(--gold)"></div></div></div>`;
  }).join('');
  const pillarMonth = pillars.length ? pillars[0].month : '';

  document.getElementById('content').innerHTML=`
    <div class="tease">🎬 <strong>GetCloned — AI Cloned Reels</strong> — every reel below is produced by Dr. Madhu Sudan's AI clone and published across Instagram, YouTube Shorts & Facebook. Fully automated content engine.</div>
    <div class="stats">
      <div class="stat accent"><div class="label">Total Cloned Reels</div><div class="num">${c.total_reels||0}</div><div class="sub">published all platforms</div></div>
      <div class="stat"><div class="label">Total Views</div><div class="num">${Number(c.total_views||0).toLocaleString('en-IN')}</div><div class="sub">across all reels</div></div>
    </div>

    <div class="panel" style="margin-bottom:26px">
      <h3>Views Growth — Month by Month</h3>
      <div class="trend">${curve||'<div class="loading">No data yet</div>'}</div>
    </div>

    <div class="grid">
      <div class="panel"><h3>Cloned Reels Published — by Month</h3>${reelBars||'<div style="color:var(--text-faint);font-size:13px">No data yet</div>'}</div>
      <div class="panel"><h3>Views by Content Pillar <span style="color:var(--text-faint);font-weight:400;font-size:11px;text-transform:none;letter-spacing:0">· ${pillarMonth}</span></h3>${pillarBars||'<div style="color:var(--text-faint);font-size:13px">No pillar data yet</div>'}</div>
    </div>

    <div class="panel"><h3>Monthly Breakdown</h3>
      <table class="tbl"><thead><tr><th>Month</th><th style="color:var(--gold)">Cloned Reels</th><th style="color:var(--green)">Views</th><th class="hide-m">Platform Split</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  document.getElementById('lastSync').textContent='Synced '+new Date().toLocaleTimeString();
}

// ─── FOLLOW-UP DESK ──────────────────────────────────────────────────────────
let DESK = null;          // rows from /api/desk
let DESK_FILTER = 'work'; // work | due | appt | converted | lost | all
let DESK_DOOR = 'all';
let DESK_Q = '';
let DESK_SYNCED = false;

const DESK_STATUSES = ['New','Contacted','Talk again later','Appointment booked','Appointment done','Converted','Not interested'];

function deskPass(){ return sessionStorage.getItem('pulse_p') || ''; }

function loadDesk(){
  const doList = () => fetch('/api/desk', { headers: { 'x-pulse-pass': deskPass() } })
    .then(r=>r.json()).then(d=>{ DESK = d.leads || []; renderDesk(); });
  if(!DESK_SYNCED){
    // one sync per visit: pull new payments + new leads, flip paid people to Converted
    document.getElementById('content').innerHTML = '<div class="loading">Checking for new leads and payments…</div>';
    fetch('/api/desk', { method:'POST', headers:{ 'x-pulse-pass': deskPass(), 'Content-Type':'application/json' }, body: JSON.stringify({action:'sync'}) })
      .then(()=>{ DESK_SYNCED = true; })
      .catch(()=>{})
      .then(doList);
  } else {
    doList();
  }
}

function deskToday(){ const d = new Date(); return d.toISOString().slice(0,10); }

function deskMatches(l){
  const active = ['New','Contacted','Talk again later'];
  if(DESK_FILTER==='work'      && !active.includes(l.status)) return false;
  if(DESK_FILTER==='due'       && !(l.next_followup && l.next_followup <= deskToday() && !['Converted','Not interested','Appointment done'].includes(l.status))) return false;
  if(DESK_FILTER==='appt'      && !['Appointment booked','Appointment done'].includes(l.status)) return false;
  if(DESK_FILTER==='converted' && l.status!=='Converted') return false;
  if(DESK_FILTER==='lost'      && l.status!=='Not interested') return false;
  if(DESK_DOOR!=='all' && l.came_from!==DESK_DOOR) return false;
  if(DESK_Q){
    const q = DESK_Q.toLowerCase();
    if(!((l.name||'').toLowerCase().includes(q) || (l.email||'').includes(q) || (l.phone||'').includes(q))) return false;
  }
  return true;
}

function setDeskFilter(f,btn){ DESK_FILTER=f; document.querySelectorAll('.desk-controls button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); paintDesk(); }

function renderDesk(){
  if(DESK===null){ loadDesk(); return; }
  const el = document.getElementById('content');
  const active = DESK.filter(l=>['New','Contacted','Talk again later'].includes(l.status));
  const due = DESK.filter(l=>l.next_followup && l.next_followup <= deskToday() && !['Converted','Not interested','Appointment done'].includes(l.status));
  const conv = DESK.filter(l=>l.status==='Converted');
  const collected = DESK.reduce((s,l)=>s+(Number(l.total_paid)||0),0);
  el.innerHTML = `
    <div class="tease">📞 <strong>Follow-up Desk</strong> — every lead and buyer from all funnels in one list. Update the status after every call; people who pay flip to Converted on their own.</div>
    <div class="stats">
      <div class="stat accent"><div class="label">To Work</div><div class="num">${active.length}</div><div class="sub">leads not yet closed</div></div>
      <div class="stat"><div class="label">Due For A Call</div><div class="num">${due.length}</div><div class="sub">follow-up date reached</div></div>
      <div class="stat"><div class="label">Converted</div><div class="num">${conv.length}</div><div class="sub">paid customers</div></div>
      <div class="stat"><div class="label">Collected</div><div class="num" style="font-size:26px;">${fmtINR(collected)}</div><div class="sub">from everyone here</div></div>
    </div>
    <div class="desk-controls">
      <button class="${DESK_FILTER==='work'?'active':''}" onclick="setDeskFilter('work',this)">To work</button>
      <button class="${DESK_FILTER==='due'?'active':''}" onclick="setDeskFilter('due',this)">Due today</button>
      <button class="${DESK_FILTER==='appt'?'active':''}" onclick="setDeskFilter('appt',this)">Appointments</button>
      <button class="${DESK_FILTER==='converted'?'active':''}" onclick="setDeskFilter('converted',this)">Converted</button>
      <button class="${DESK_FILTER==='lost'?'active':''}" onclick="setDeskFilter('lost',this)">Not interested</button>
      <button class="${DESK_FILTER==='all'?'active':''}" onclick="setDeskFilter('all',this)">All</button>
      <select onchange="DESK_DOOR=this.value;paintDesk()">
        <option value="all">Every funnel</option>
        <option value="Assessment" ${DESK_DOOR==='Assessment'?'selected':''}>Assessment</option>
        <option value="Routine" ${DESK_DOOR==='Routine'?'selected':''}>Routine</option>
        <option value="Consultation page" ${DESK_DOOR==='Consultation page'?'selected':''}>Consultation page</option>
        <option value="Modak page" ${DESK_DOOR==='Modak page'?'selected':''}>Modak page</option>
      </select>
      <input class="desk-search" placeholder="Search name / phone / email" value="${DESK_Q}" oninput="DESK_Q=this.value;paintDesk()">
    </div>
    <div id="deskList"></div>`;
  paintDesk();
  document.getElementById('lastSync').textContent = 'Synced ' + new Date().toLocaleTimeString();
}

function paintDesk(){
  const list = document.getElementById('deskList');
  if(!list) return;
  const rows = DESK.filter(deskMatches);
  if(!rows.length){ list.innerHTML = '<div class="loading">Nothing here. Pick another filter.</div>'; return; }
  list.innerHTML = rows.slice(0,400).map(l=>{
    const phone10 = (l.phone||'').slice(-10);
    const wa = (l.phone||'').length>=10 ? ((l.phone.length===10?'91':'')+l.phone) : '';
    const links = [
      l.phone ? `<a href="tel:+${wa}">📞 ${phone10}</a>` : '<span style="color:var(--orange);font-size:12px">no phone</span>',
      wa ? `<a href="https://wa.me/${wa}" target="_blank">WhatsApp</a>` : '',
      `<a href="mailto:${l.email}" style="color:var(--text-dim);font-weight:400">${l.email}</a>`
    ].filter(Boolean).join(' ');
    const dueCls = (l.next_followup && l.next_followup <= deskToday()) ? 'due' : '';
    const boughtBit = l.bought ? ` · <span style="color:var(--gold)">${l.bought} · ${fmtINR(l.total_paid)}</span>` : '';
    const opts = DESK_STATUSES.map(s=>`<option ${s===l.status?'selected':''}>${s}</option>`).join('');
    return `<div class="lead" id="lead-${l.id}">
      <div class="lead-top">
        <span class="lead-name">${l.name||'(no name)'}</span>
        <span class="lead-links">${links}</span>
      </div>
      <div class="lead-sub">
        <span class="src-pill">${l.came_from}</span>
        <span>first seen ${l.first_seen ? l.first_seen.slice(0,10) : '—'}</span>${boughtBit}
      </div>
      <div class="lead-edit">
        <select onchange="saveLead('${l.id}')">${opts}</select>
        <input type="date" class="${dueCls}" value="${l.next_followup||''}" onchange="saveLead('${l.id}')">
        <input type="text" placeholder="Note after the call" value="${(l.note||'').replace(/"/g,'&quot;')}" onchange="saveLead('${l.id}')">
        <span class="lead-saved" id="saved-${l.id}"></span>
      </div>
    </div>`;
  }).join('') + (rows.length>400?`<div class="loading">Showing 400 of ${rows.length} — narrow the filter.</div>`:'');
}

function saveLead(id){
  const card = document.getElementById('lead-'+id);
  const [sel, dateIn, noteIn] = card.querySelectorAll('select, input[type=date], input[type=text]');
  card.classList.add('saving');
  fetch('/api/desk', { method:'POST', headers:{ 'x-pulse-pass': deskPass(), 'Content-Type':'application/json' },
    body: JSON.stringify({ action:'update', id, status: sel.value, next_followup: dateIn.value || null, note: noteIn.value || null }) })
  .then(r=>r.json()).then(d=>{
    card.classList.remove('saving');
    const tag = document.getElementById('saved-'+id);
    tag.textContent = d.ok ? 'Saved' : 'Failed';
    tag.style.color = d.ok ? 'var(--green)' : 'var(--orange)';
    const row = DESK.find(x=>x.id===id);
    if(d.ok && row){ row.status = sel.value; row.next_followup = dateIn.value||null; row.note = noteIn.value||null; }
    setTimeout(()=>{ tag.textContent=''; }, 1800);
  })
  .catch(()=>{ card.classList.remove('saving'); const tag=document.getElementById('saved-'+id); tag.textContent='Failed'; tag.style.color='var(--orange)'; });
}</script>
