        <div class="bar-row"><div class="bar-head"><span class="bl">Paid, not yet sent</span><span class="bv"><b style="color:${shipQ?'var(--gold-light)':'var(--olive)'}">${shipQ}</b></span></div></div>
        <div class="bar-row"><div class="bar-head"><span class="bl">Reorders due this week</span><span class="bv"><b style="color:${reDue?'var(--gold-light)':'var(--olive)'}">${reDue}</b></span></div></div>
        <div class="bar-row"><div class="bar-head"><span class="bl">Reorder calls overdue</span><span class="bv"><b style="color:${reOverdue?'var(--wine)':'var(--olive)'}">${reOverdue}</b></span></div></div>
        <div class="bar-row"><div class="bar-head"><span class="bl">Appointments, next 7 days</span><span class="bv"><b style="color:var(--text)">${appts7.length}</b></span></div></div>
        <div class="note">Every one of these is a queue on the Today screen.</div>
      </div>
    </div>

    <details class="fold"><summary>Assessment details</summary>
      <div class="grid2">
        <div class="panel"><h3>Zones <small>· all time</small></h3>${Object.entries(st.zones||{}).map(([z,v])=>`<div class="bar-row"><div class="bar-head"><span class="bl">${esc(z)}</span><span class="bv">${v}</span></div><div class="bar-track"><div class="bar-fill" style="width:${v/Math.max(1,...Object.values(st.zones||{}))*100}%;background:${z==='Thriving'?'var(--olive)':z==='Growth'?'var(--gold)':'var(--wine)'}"></div></div></div>`).join('')||'<div class="note">No data yet</div>'}</div>
        <div class="panel"><h3>What they came for</h3>${Object.entries(st.concerns||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar-row"><div class="bar-head"><span class="bl">${esc(k||'Not said')}</span><span class="bv">${v}</span></div><div class="bar-track"><div class="bar-fill" style="width:${v/Math.max(1,...Object.values(st.concerns||{}))*100}%;background:var(--gold)"></div></div></div>`).join('')||'<div class="note">No data yet</div>'}</div>
      </div>
      <div class="note">${st.total||0} assessments all time, ${st.month||0} in the last 30 days, ${st.today||0} today. Average score ${st.avg_score||0} of 120.</div>
    </details>`;
}
function opsHTML(){
  if(!OPS){
    fetch('/api/ops',{headers:{'x-ops-pass':pass()}}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{ OPS=d.intel||{}; if(TAB==='results') renderResults(); }).catch(()=>{ OPS={}; });
    return '<div class="opsbox"><h3>Opportunities · ours only</h3><div class="note">Reading…</div></div>';
  }
  const o=OPS, pct=(a,b)=>b>0?Math.round((b-a)/b*100):0;
  const drop30=pct(o.submitted_30||0,o.reached_30||0);
  const c=(cls,t,n,s,d)=>`<div class="opscard ${cls}"><b>${t}</b><div class="n">${n}</div><div class="s">${s}</div><div class="d">→ ${d}</div></div>`;
  return `<div class="opsbox"><h3>Opportunities · ours only, never on the client key</h3>
    ${(o.reached_all||0)===0?c('','Assessment drop-off','Waiting','Counting only started recently.','Check back in a few days.'):c(drop30>=40?'warn':drop30<=20?'good':'','Assessment drop-off, last 30 days',drop30+'%',(o.reached_30||0)+' saw the score screen, '+(o.submitted_30||0)+' gave their details.',drop30>=40?'High. Test a shorter form.':'Healthy. Leave the form alone.')}
    ${c((o.leads_no_phone||0)>0?'warn':'good','People with no phone number',o.leads_no_phone||0,'Out of '+(o.leads_total||0)+'. They came in before the phone field was made compulsory.',(o.leads_no_phone||0)>0?'Email them once and ask for a number.':'Everyone is callable.')}
    ${c((o.p1_untouched||0)>20?'warn':'good','Never contacted, no call date',o.p1_untouched||0,'Out of '+(o.p1_total||0)+' in Consultation.',(o.p1_untouched||0)>20?'The tool works, the calling does not. Raise it with Manish.':'The team is working the list.')}
    ${c('','Scored under 50',o.low_score_total||0,(o.low_score_no_phone||0)+' of them have no phone number.','Give Manish this list first.')}
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// VIEWS. Cloned reels against edited videos, by month and by platform. Lives on
// the Results screen now, beside the money, because both are what we sell.
// ─────────────────────────────────────────────────────────────────────────────
function contentModel(){
  const rows=(DATA&&DATA.content2)||[];
  if(!rows.length) return null;
  const months=[], byM={};
  rows.forEach(r=>{ if(!byM[r.month]){ byM[r.month]={month:r.month,cloned:{v:0,views:0},es:{v:0,views:0},el:{v:0,views:0},ig:0,yt:0,fb:0,total:0}; months.push(r.month);} const m=byM[r.month]; const slot=r.type==='Cloned reel'?m.cloned:r.type==='Edited long'?m.el:m.es; slot.v+=r.videos; slot.views+=r.total; m.ig+=r.ig; m.yt+=r.yt; m.fb+=r.fb; m.total+=r.total; });
  const tot=rows.reduce((a,r)=>{ a.views+=r.total; a.ig+=r.ig; a.yt+=r.yt; a.fb+=r.fb; if(r.type==='Cloned reel'){a.cv+=r.videos;a.cviews+=r.total;} else if(r.type==='Edited long'){a.lv+=r.videos;a.lviews+=r.total;} else {a.sv+=r.videos;a.sviews+=r.total;} return a; },{views:0,ig:0,yt:0,fb:0,cv:0,cviews:0,sv:0,sviews:0,lv:0,lviews:0});
  return {rows, months, byM, tot, latest:byM[months[months.length-1]]};
}
function contentHTML(M){
  const {months, byM, tot, latest}=M;
  const mMax=Math.max(1,...months.map(k=>byM[k].total));
  const avg=(v,n)=>n?Math.round(v/n):0;
  const trend=months.map(k=>{ const m=byM[k]; const parts=[{v:m.el.views,col:'var(--gold)',l:'Long edits'},{v:m.es.views,col:'var(--line-2)',l:'Short edits'},{v:m.cloned.views,col:'var(--wine)',l:'Cloned reels'}].filter(p=>p.v>0);
    return `<div class="col"><div class="val">${fmtK(m.total)}</div><div style="width:100%;max-width:34px;display:flex;flex-direction:column;justify-content:flex-end;height:${m.total/mMax*100}%;min-height:3px;">${parts.map((p,i)=>`<div style="height:${p.v/m.total*100}%;background:${p.col};${i===0?'border-radius:4px 4px 0 0;':''}" title="${p.l}: ${p.v.toLocaleString('en-IN')}"></div>`).join('')}</div><div class="day">${k.replace(' 20',"'")}</div></div>`; }).join('');
  const pMax=Math.max(1,tot.ig,tot.yt,tot.fb);
  const plat=(l,v,c)=>`<div class="bar-row"><div class="bar-head"><span class="bl">${l}</span><span class="bv">${v.toLocaleString('en-IN')}</span></div><div class="bar-track"><div class="bar-fill" style="width:${v/pMax*100}%;background:${c}"></div></div></div>`;
  const times=tot.sv?Math.round(avg(tot.cviews,tot.cv)/Math.max(1,avg(tot.sviews,tot.sv))):null;
  return `
    <div class="stats">
      <div class="stat gold"><div class="k">${esc(latest.month)}</div><div class="v">${fmtK(latest.total)}</div><div class="s">${latest.cloned.v} cloned · ${latest.es.v} short + ${latest.el.v} long edits</div></div>
      <div class="stat"><div class="k">All time views</div><div class="v">${fmtK(tot.views)}</div><div class="s">${tot.views.toLocaleString('en-IN')} across every platform</div></div>
      <div class="stat"><div class="k">Cloned reels</div><div class="v">${tot.cv}</div><div class="s">about ${fmtK(avg(tot.cviews,tot.cv))} views each</div></div>
      <div class="stat"><div class="k">Edited videos</div><div class="v">${tot.sv+tot.lv}</div><div class="s">shorts about ${fmtK(avg(tot.sviews,tot.sv))} each${tot.lv?` · long about ${fmtK(avg(tot.lviews,tot.lv))}`:''}</div></div>
    </div>
    <div class="panel"><div class="verdict">${times?`A cloned reel gets about <b>${times} times</b> the views of a short he filmed himself${tot.lv?`, and about <b>${Math.round(avg(tot.cviews,tot.cv)/Math.max(1,avg(tot.lviews,tot.lv)))} times</b> a long video`:''}. That is his own data, not a claim.`:'Cloned reels are made by his AI clone, no shooting. Edited videos are his own footage, cut by the team.'}</div>
      <h3 style="margin-top:16px">Views month by month <small>· wine cloned reels, grey short edits, gold long edits</small></h3><div class="trend">${trend}</div></div>
    <details class="fold"><summary>More on views: by platform, and the month by month table</summary>
      <div class="grid2">
        <div class="panel"><h3>Views by platform · all time</h3>${plat('Instagram',tot.ig,'var(--wine)')}${plat('YouTube',tot.yt,'var(--gold)')}${plat('Facebook',tot.fb,'var(--slate)')}</div>
        <div class="panel"><h3>Views by platform · ${esc(latest.month)}</h3>${plat('Instagram',latest.ig,'var(--wine)')}${plat('YouTube',latest.yt,'var(--gold)')}${plat('Facebook',latest.fb,'var(--slate)')}</div>
      </div>
      <div class="panel"><table class="tbl"><thead><tr><th>Month</th><th style="color:var(--wine)">Cloned</th><th>Short</th><th style="color:var(--gold-light)">Long</th><th class="hide-m">Instagram</th><th class="hide-m">YouTube</th><th class="hide-m">Facebook</th><th style="color:var(--olive)">Views</th></tr></thead>
        <tbody>${months.slice().reverse().map(k=>{ const m=byM[k]; return `<tr><td class="nm">${esc(k)}</td><td class="num" style="color:var(--wine)">${m.cloned.v}</td><td>${m.es.v||'–'}</td><td style="color:var(--gold-light)">${m.el.v||'–'}</td><td class="hide-m">${m.ig.toLocaleString('en-IN')}</td><td class="hide-m">${m.yt.toLocaleString('en-IN')}</td><td class="hide-m">${m.fb.toLocaleString('en-IN')}</td><td class="num" style="color:var(--olive)">${m.total.toLocaleString('en-IN')}</td></tr>`; }).join('')}</tbody></table></div>
    </details>`;
}

</script>
